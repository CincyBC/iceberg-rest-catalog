[project]
name = "iceberg-rest"
version = "0.1.0"
description = "An Apache Iceberg REST Catalog implementation in Python."
authors = ["Kevin Liu <kevinjqliu@users.noreply.github.com>", "GoldToothRichards <crabtr26@proton.me>"]
readme = "README.md"
packages = [{ include = "iceberg_rest", from = "src" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.11",
    "pandas>=2.2.3",
    "pre-commit>=4.1.0",
    "pyarrow>=19.0.1",
    "pydantic-settings>=2.8.1",
    "pyiceberg>=0.9.0",
    "s3fs>=2025.2.0",
    "sqlalchemy>=2.0.38",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "moto>=5.1.1",
    "pytest>=8.3.5",
    "pytest-lazy-fixture>=0.6.3",
    "pytest-icdiff>=0.9",
    "pyright>=1.1.396",
    "pyspark>=3.5.5",
]
base = []
mysql = [
    "mysqlclient>=2.2.7",
]
postgres = [
    "psycopg2-binary>=2.9.10",
]


